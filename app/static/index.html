<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Cinema</title>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<div data-testid="app" id="app">
  <header>
    <svg data-testid="logo-mark" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--text)" stroke-width="1.5"/><line x1="16" y1="12" x2="22" y2="12" fill="none" stroke="var(--muted)" stroke-width="1.5"/><line x1="14" y1="15.46" x2="17" y2="20.66" fill="none" stroke="var(--muted)" stroke-width="1.5"/><line x1="10" y1="15.46" x2="7" y2="20.66" fill="none" stroke="var(--muted)" stroke-width="1.5"/><line x1="8" y1="12" x2="2" y2="12" fill="none" stroke="var(--muted)" stroke-width="1.5"/><line x1="10" y1="8.54" x2="7" y2="3.34" fill="none" stroke="var(--muted)" stroke-width="1.5"/><line x1="14" y1="8.54" x2="17" y2="3.34" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>
    <h1>Open Cinema</h1>
    <span data-testid="comfy-status"></span>
  </header>
  <div data-testid="comfy-banner" role="alert" hidden><span data-testid="comfy-banner-text"></span><button data-testid="comfy-retry">Retry</button></div>
  <section id="director">
    <label for="shot-description">Scene</label>
    <textarea id="shot-description" data-testid="shot-description" maxlength="1000" placeholder="e.g. A woman in a red coat walks through a rainy neon street"></textarea>
    <h2 class="panel-heading">Camera</h2>
    <div data-testid="camera-group" role="radiogroup" aria-label="Camera move"></div>
    <h2 class="panel-heading">Lens</h2>
    <div data-testid="lens-group" role="radiogroup" aria-label="Lens"></div>
    <h2 class="panel-heading">Framing</h2>
    <div data-testid="framing-group" role="radiogroup" aria-label="Framing"></div>
    <h2 class="panel-heading">Aperture</h2>
    <div class="aperture">
      <div class="iris" data-testid="aperture-iris" aria-hidden="true"></div>
      <input type="range" data-testid="aperture-slider" id="aperture-slider" min="0" max="7" step="1" value="2" aria-label="Aperture">
      <div class="fstop-scale" data-testid="aperture-scale" aria-hidden="true"><span>1.4</span><span>2</span><span>2.8</span><span>4</span><span>5.6</span><span>8</span><span>11</span><span>16</span></div>
      <output data-testid="aperture-value" for="aperture-slider">f/2.8</output>
    </div>
    <p data-testid="subject-distance"></p>
    <div class="actions">
      <button data-testid="generate-button">Generate shot</button>
      <p data-testid="submit-error" role="alert" hidden></p>
    </div>
  </section>
  <section id="monitor">
    <div data-testid="viewport" data-state="empty">
      <span data-testid="crop-mark" class="tl"></span>
      <span data-testid="crop-mark" class="tr"></span>
      <span data-testid="crop-mark" class="bl"></span>
      <span data-testid="crop-mark" class="br"></span>
      <div data-testid="hud"></div>
      <p data-testid="viewport-hint">Describe a shot and press Generate.</p>
    </div>
    <div data-testid="optics-controls" hidden></div>
    <section data-testid="status-panel" hidden>
      <span data-testid="record-dot" class="record-dot"></span>
      <p data-testid="status-label"></p>
      <button data-testid="cancel-button" hidden>Cancel</button>
      <p data-testid="error-message" role="alert" hidden></p>
      <button data-testid="retry-button" hidden></button>
      <span data-testid="elapsed">0:00</span>
      <div data-testid="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress"><div class="progress-fill" style="width:0%"></div></div>
      <ul>
        <li data-testid="stage-generate">Generate video</li>
        <li data-testid="stage-optics">Apply optics</li>
      </ul>
    </section>
  </section>
  <section id="history"><button type="button" data-testid="history-new">New shot</button><ul data-testid="history-list"></ul></section>
</div>
</body>
</html>
